<script>
const P = JSON.parse(document.getElementById("payload").textContent);
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b(P.iv)}, key, b(P.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw, remember) {
  try {
    const html = await unlock(pw);
    sessionStorage.setItem("board_pw", pw);          // game pages unlock without re-entry
    if (remember) localStorage.setItem("board_pw", pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    localStorage.removeItem("board_pw"); sessionStorage.removeItem("board_pw");
    document.getElementById("err").textContent = "Wrong password.";
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault(); go(document.getElementById("pw").value, document.getElementById("rem").checked);
});
const saved = localStorage.getItem("board_pw") || sessionStorage.getItem("board_pw");
if (saved) go(saved, !!localStorage.getItem("board_pw"));
</script>
